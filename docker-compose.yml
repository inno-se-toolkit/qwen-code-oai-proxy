services:
  qwen-code-api:
    build: .

    ports:
      - "${QWEN_CODE_API_HOST_PORT:-8080}:${PORT:-8080}"

    volumes:
      - ~/.qwen:/root/.qwen

    environment:
      - NODE_ENV=production
      - PORT=${PORT:-8080}
      - HOST=${HOST:-0.0.0.0}
      - DEBUG_LOG=${DEBUG_LOG:-false}
      - LOG_FILE_LIMIT=${LOG_FILE_LIMIT:-20}
      - STREAM=${STREAM:-false}
      - DEFAULT_ACCOUNT=${DEFAULT_ACCOUNT:-}
      - QWEN_CODE_AUTH_USE=${QWEN_CODE_AUTH_USE:-true}
      - QWEN_CODE_API_KEY=${QWEN_CODE_API_KEY:-}

    networks:
      - lms-network

    restart: unless-stopped

    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - |
          const req = require('http').request({
            hostname: 'localhost',
            port: '${PORT:-8080}',
            path: '/health',
            method: 'GET',
            headers: { 'X-API-Key': '${QWEN_CODE_API_KEY:-}' }
          }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1) });
          req.on('error', () => process.exit(1));
          req.end();
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  lms-network:
    name: lms-network
    attachable: true
